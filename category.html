<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - Tecno Store</title>

    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/navbar.css">
    <link rel="stylesheet" href="styles/actions-buttons.css">
    <link rel="stylesheet" href="styles/products.css">
    <link rel="stylesheet" href="styles/cart.css">
    <link rel="stylesheet" href="styles/user.css">

    <link rel="icon" type="image/png" href="images/logo.png">
</head>
    <body>

        <header class="navbar">

<!-- Logo NavBar -->
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="Logo da Tecno Store">
                </a>
            </div>

<!-- Categories NavBar -->
            <nav class="menu">
                <a href="category.html?cat=Computer">Computadores</a>
                <a href="category.html?cat=Notebook">Notebooks</a>
                <a href="category.html?cat=Monitor">Monitores</a>
                <a href="category.html?cat=Cellphone">Celulares</a>
                <a href="category.html?cat=Tablet">Tablets</a>
            </nav>

            <div class="actions">

<!-- SearchBar -->
                <input type="text" placeholder="Pesquisar" id="searchInput">

<!-- Cart -->
                <div class="cart-container">
                    <button class="btn-icon cart-btn" id="cartBtn" aria-label="Abrir carrinho">
                        <span class="cart-badge" id="cartCount"></span>
                        <svg class="icon-cart" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="8" cy="21" r="1"></circle>
                            <circle cx="19" cy="21" r="1"></circle>
                            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
                        </svg>
                    </button>

<!-- Cart Pop-Up -->
                    <div class="cart-overlay" id="cartOverlay">
                        <div class="cart-popup" id="cartPopup">
                            <h2>Seu carrinho</h2>
                            <ul id="cartItems"></ul>
                            <div class="cart-footer">
                                <strong id="cartTotal">Total: R$ 0</strong>
                            </div>
                        </div>
                    </div>
                </div>

<!-- User -->
                <button class="btn-icon user-btn" aria-label="Abrir área do usuário">
                    <svg class="icon-user" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <path d="M16 3.128a4 4 0 0 1 0 7.744"></path>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                    </svg>
                </button>
            </div>

<!-- User Pop Up -->
            <div class="user-overlay" id="userOverlay">
                <div class="user-popup" id="userPopup">
                    <!-- O formulário de login será gerado a partir daqui pelo user.js -->
                </div>
            </div>
        </header>

        <main>

<!-- Produtos -->
            <section class="products">
                <h2 id="categoryTitle">Produtos</h2>

                <div class="product-grid" id="productGrid">
                    <!-- Os produtos serão gerados aqui pelo products.js -->
                </div>
            </section>

        </main>

        <script src="scripts/cart.js" defer></script>
        <script src="scripts/user.js" defer></script>
        <script src="scripts/products.js" defer></script>
        <script src="scripts/search.js" defer></script>

        <script>

            // Pega a categoria da URL
            function getCategoryFromURL() {
                const params = new URLSearchParams(window.location.search);
                return params.get("cat");
            }

            // Carrega os produtos da categoria
            async function loadCategoryProducts() {
                try {
                    const response = await fetch("./data/products.json");

                    if (!response.ok) {
                        throw new Error("Erro ao carregar os produtos.");
                    }

                    const products = await response.json();
                    const category = getCategoryFromURL();

                    // Filtra os produtos pela categoria
                    const filteredProducts = category
                        ? products.filter(product => product.category === category)
                        : products;

                    // Nome das categorias
                    const categoryNames = {
                        Computer: "Computadores",
                        Notebook: "Notebooks",
                        Monitor: "Monitores",
                        Cellphone: "Celulares",
                        Tablet: "Tablets"
                    };

                    // Atualiza o título da página
                    document.getElementById("categoryTitle").textContent =
                        categoryNames[category] || "Produtos";

                    // Renderiza os produtos
                    renderProducts(filteredProducts);
                } catch (error) {
                    console.error("Erro ao carregar produtos:", error);
                    document.getElementById("categoryTitle").textContent = "Erro ao carregar produtos";
                }
            }

            // Inicializa o carregamento
            loadCategoryProducts();

        </script>
    </body>
</html>
